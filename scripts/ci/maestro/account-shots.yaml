appId: ${APP_ID}
---
# 登录 + 五个业务页面截图
# 账号密码由 GitHub Secrets 注入，不写入仓库
- launchApp:
    clearState: true

# 冷启动默认是游客首页（iOS 审核要求），先截一张诊断图
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: ${PREFIX}-debug-launch

# ATT / 通知等系统弹窗（模拟器为英文，中英文都处理；可能延迟出现，做两次）
- tapOn:
    text: "Ask App Not to Track"
    optional: true
- tapOn:
    text: "要求.*不跟踪"
    optional: true
- waitForAnimationToEnd:
    timeout: 2000
- tapOn:
    text: "Allow"
    optional: true
- tapOn:
    text: "允许"
    optional: true
- waitForAnimationToEnd:
    timeout: 2000
- tapOn:
    text: "Ask App Not to Track"
    optional: true

# 游客首页 → 登录页
- tapOn:
    text: "登录查看"
    optional: true
- tapOn:
    text: "立即登录"
    optional: true
- waitForAnimationToEnd:
    timeout: 2000
- tapOn:
    text: "登录查看"
    optional: true

- extendedWaitUntil:
    visible: "请输入账号"
    timeout: 30000
- extendedWaitUntil:
    visible: "登录您的账户以继续"
    timeout: 30000

# 先勾选协议（小屏可能需要滚动），再输入账号密码
- scrollUntilVisible:
    element: "我已阅读并同意"
    direction: DOWN
- tapOn: "我已阅读并同意"
- scrollUntilVisible:
    element: "请输入账号"
    direction: UP
- tapOn: "请输入账号"
- inputText: ${SCREENSHOT_USERNAME}
- tapOn: "请输入密码"
- inputText: ${SCREENSHOT_PASSWORD}
- hideKeyboard

# 如果仍在登录页，滚动找到登录按钮并点击；若已自动完成登录则跳过
- runFlow:
    when:
      visible: "忘记密码？"
    commands:
      - scrollUntilVisible:
          element: "登 录"
          direction: DOWN
      - tapOn: "登 录"

# 登录请求可能受网络/租户加载影响，首次未生效时再点一次
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: ${PREFIX}-debug-after-login
- runFlow:
    when:
      visible: "登 录"
    commands:
      - tapOn: "登 录"

# 登录成功回到首页
- extendedWaitUntil:
    visible: "首页"
    timeout: 120000
- tapOn:
    text: "Allow"
    optional: true
- tapOn:
    text: "允许"
    optional: true
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: ${PREFIX}-shop-home

# 商品管理（首页可能较长，先滚动到入口）
- scrollUntilVisible:
    element: "商品管理"
    direction: DOWN
- tapOn: "商品管理"
- extendedWaitUntil:
    visible: "盘点"
    timeout: 30000
- takeScreenshot: ${PREFIX}-goods

# 库存盘点（商品管理底部“盘点”入口）
- tapOn: "盘点"
- extendedWaitUntil:
    visible: "扫码后可直接盘点当前门店商品"
    timeout: 30000
- takeScreenshot: ${PREFIX}-inventory

# 回首页后进入订单/销售详情
- stopApp
- launchApp
- extendedWaitUntil:
    visible: "首页"
    timeout: 30000
- scrollUntilVisible:
    element: "销售详情"
    direction: DOWN
- tapOn: "销售详情"
- extendedWaitUntil:
    visible: "搜索订单号、商品名称或会员信息"
    timeout: 30000
- takeScreenshot: ${PREFIX}-orders

# 点击第一张订单卡片进入订单详情（截图构建已为卡片添加详情跳转）
- tapOn:
    text: "订单编号"
    index: 0
- extendedWaitUntil:
    visible: "商品明细"
    timeout: 30000
- takeScreenshot: ${PREFIX}-order-detail

# 监控页依赖原生播放器/硬件视频流，暂时不截图
