appId: ${APP_ID}
---
# 登录 + 五个业务页面截图
# 账号密码由 GitHub Secrets 注入，不写入仓库
- launchApp:
    clearState: true

# 冷启动默认是游客首页（iOS 审核要求）
- waitForAnimationToEnd:
    timeout: 5000

# 先点 Ask App Not to Track 关闭 ATT，再截图，避免截图里带跟踪弹窗
- tapOn:
    text: "Ask App Not to Track"
    optional: true
- tapOn:
    text: "要求.*不跟踪"
    optional: true
- waitForAnimationToEnd:
    timeout: 3000

# 此时若仍有其它系统弹窗，这张诊断图会拍到（仅保留在 maestro-output，不随业务截图上传）
- takeScreenshot: ${PREFIX}-debug-launch

# 游客首页 → 登录页
- tapOn:
    text: "登录查看"
    optional: true
- tapOn:
    text: "立即登录"
    optional: true
- waitForAnimationToEnd:
    timeout: 2000
- tapOn:
    text: "登录查看"
    optional: true

- extendedWaitUntil:
    visible: "请输入账号"
    timeout: 30000
- extendedWaitUntil:
    visible: "登录您的账户以继续"
    timeout: 30000

# 截图构建已默认勾选协议，直接输入账号密码
- tapOn: "请输入账号"
- inputText: ${SCREENSHOT_USERNAME}
- tapOn: "请输入密码"
- inputText: ${SCREENSHOT_PASSWORD}
- hideKeyboard

# 如果仍在登录页，滚动找到登录按钮并点击；若已自动完成登录则跳过
# 滚动后页面可能回弹导致点击偏移（截图构建已把协议开关改成不可取消），仍停留在登录页则重试
- runFlow:
    when:
      visible: "忘记密码？"
    commands:
      - scrollUntilVisible:
          element: "登 录"
          direction: DOWN
      - tapOn: "登 录"
      - waitForAnimationToEnd:
          timeout: 5000
- runFlow:
    when:
      visible: "忘记密码？"
    commands:
      - tapOn: "登 录"
      - waitForAnimationToEnd:
          timeout: 5000
- runFlow:
    when:
      visible: "忘记密码？"
    commands:
      - tapOn: "登 录"

# 等待登录结果（不再自动二次点击，避免误触协议链接）
- waitForAnimationToEnd:
    timeout: 15000
- takeScreenshot: ${PREFIX}-debug-after-login

# 登录后可能弹通知/定位权限，先尝试关闭
- tapOn:
    text: "Allow"
    optional: true
- tapOn:
    text: "允许"
    optional: true
- tapOn:
    text: "Allow While Using App"
    optional: true
- tapOn:
    text: "使用App时允许"
    optional: true

# 登录成功回到首页
- extendedWaitUntil:
    visible: "首页"
    timeout: 180000
- tapOn:
    text: "Allow"
    optional: true
- tapOn:
    text: "允许"
    optional: true
- waitForAnimationToEnd:
    timeout: 5000
# 截图前再清一次可能延迟出现的系统弹窗（通知/定位/ATT）
- tapOn:
    text: "Allow"
    optional: true
- tapOn:
    text: "允许"
    optional: true
- tapOn:
    text: "Allow Once"
    optional: true
- tapOn:
    text: "允许一次"
    optional: true
- tapOn:
    text: "Don't Allow"
    optional: true
- tapOn:
    text: "不允许"
    optional: true
- tapOn:
    text: "Ask App Not to Track"
    optional: true
- tapOn:
    text: "要求.*不跟踪"
    optional: true
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: ${PREFIX}-shop-home

# 商品管理（首页可能较长，先滚动到入口）
- scrollUntilVisible:
    element: "商品管理"
    direction: DOWN
- tapOn: "商品管理"
- waitForAnimationToEnd:
    timeout: 3000
# 首次点击可能未生效（仍在首页），重试一次
- runFlow:
    when:
      visible: "首页"
    commands:
      - scrollUntilVisible:
          element: "商品管理"
          direction: DOWN
      - tapOn: "商品管理"
- extendedWaitUntil:
    visible: "盘点"
    timeout: 60000
- takeScreenshot: ${PREFIX}-goods

# 库存盘点（商品管理底部“盘点”入口）
- tapOn: "盘点"
- extendedWaitUntil:
    visible: "扫码后可直接盘点当前门店商品"
    timeout: 30000
- takeScreenshot: ${PREFIX}-inventory

# 回首页后进入订单/销售详情
- stopApp
- launchApp
- extendedWaitUntil:
    visible: "首页"
    timeout: 30000
- scrollUntilVisible:
    element: "销售详情"
    direction: DOWN
- tapOn: "销售详情"
- waitForAnimationToEnd:
    timeout: 3000
- runFlow:
    when:
      visible: "首页"
    commands:
      - scrollUntilVisible:
          element: "销售详情"
          direction: DOWN
      - tapOn: "销售详情"
- extendedWaitUntil:
    visible: "搜索订单号、商品名称或会员信息"
    timeout: 60000
- takeScreenshot: ${PREFIX}-orders

# 点击第一张订单卡片进入订单详情（截图构建已为卡片添加详情跳转）
- tapOn:
    text: "订单编号"
    index: 0
- extendedWaitUntil:
    visible: "商品明细"
    timeout: 30000
- takeScreenshot: ${PREFIX}-order-detail

# 监控页依赖原生播放器/硬件视频流，暂时不截图
