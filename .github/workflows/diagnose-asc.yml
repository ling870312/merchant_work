name: Diagnose ASC Build Status

on:
  workflow_dispatch:
    inputs:
      oem_channel:
        description: 'OEM 渠道码（须与 Secret 命名一致）'
        required: true

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Write P8 key
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
        run: |
          mkdir -p "$HOME/private_keys"
          printf '%s' "$ASC_API_KEY_P8" > "$HOME/private_keys/AuthKey_${ASC_API_KEY_ID}.p8"
          chmod 600 "$HOME/private_keys/AuthKey_${ASC_API_KEY_ID}.p8"

      - name: Resolve channel bundleId (from Secret)
        env:
          CHANNEL_BUNDLE_ID: ${{ secrets[format('IOS_BUNDLE_ID_{0}', inputs.oem_channel)] }}
        run: |
          set -eu
          CHANNEL="${{ inputs.oem_channel }}"
          BID="${CHANNEL_BUNDLE_ID:-}"
          [ -n "$BID" ] || { echo "::error::未配置渠道 ${CHANNEL} 的 bundleId Secret (IOS_BUNDLE_ID_${CHANNEL})"; exit 1; }
          printf "::add-mask::%s\n" "$BID"
          echo "BUNDLE_ID=$BID" >> "$GITHUB_ENV"
          echo "bundleId resolved for channel: $CHANNEL"

      - name: Query ASC builds
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          BUNDLE_ID: ${{ env.BUNDLE_ID }}
        run: |
          export P8_FILE="$HOME/private_keys/AuthKey_${ASC_API_KEY_ID}.p8"
          ruby scripts/ci/diagnose-asc.rb
